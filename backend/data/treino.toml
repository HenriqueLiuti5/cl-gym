# Catálogo de treino do CL Gym: exercícios compartilhados e fichas modelo.
#
# Depois de editar, carregue no banco com:  uv run python -m backend.seed
#
# - Os exercícios daqui são do catálogo: todo mundo baixa e ninguém altera pelo app.
# - As fichas daqui são modelos prontos, opcionais: a conta nova começa sem fichas, e o app
#   oferece estes modelos em "Usar um modelo pronto" (GET /api/modelos). Quem escolhe um recebe
#   uma cópia e depois edita a sua. Mudar uma ficha modelo não altera as cópias que já existem.
#
# Regras:
# - `slug` é o identificador fixo (minúsculas e hífens). Não mude o slug de algo que já está
#   em uso: o histórico de cargas está ligado a ele. Para renomear, mude só o `nome`.
# - `substitutos` (no exercício): slugs de até 5 exercícios parecidos, do mais parecido ao menos,
#   sem repetir e sem o próprio. O app sugere os 2 primeiros como Plano B ao montar um treino e
#   mostra todos na troca durante o treino.
# - A ordem dos exercícios dentro da ficha é a ordem em que aparecem aqui (e `ordem` da ficha é
#   só a ordem de exibição dos modelos).
# - `alvo_reps` é um número só (nunca faixa): mesmo peso em todas as séries, parando a 1–2 reps
#   da falha.
# - `aquecimento = true` mostra "1×10 leve (~50% do peso)" antes (normalmente só no primeiro).
# - `alternativas` (Plano B): slugs de até 2 exercícios, em ordem de preferência.
# - Nada pessoal aqui (o repositório é público): só nomes, séries, alvo, aquecimento, Plano B,
#   substitutos e dicas de execução.
#
# Exemplo de exercício:
#
# [[exercicios]]
# slug = "supino-reto-barra"
# nome = "Supino reto com barra"
# grupo_muscular = "Peito"
# imagens = []        # URLs das imagens de demonstração
# instrucoes = []     # passos da execução, em português
# midia_url = ""      # opcional: link de GIF/vídeo de demonstração
# substitutos = ["supino-reto-halter", "supino-reto-maquina"]   # até 5, do mais parecido ao menos
#
# E dentro da ficha:
#   exercicios = [
#     { exercicio = "supino-reto-barra", series = 3, alvo_reps = 8, aquecimento = true,
#       alternativas = ["supino-reto-maquina", "supino-reto-halter"],
#       observacao = "Escápulas presas no banco" },
#     { exercicio = "crucifixo-maquina", series = 3, alvo_reps = 12 },
#     { exercicio = "triceps-corda", series = 3, alvo_reps = 12 },
#   ]
#

