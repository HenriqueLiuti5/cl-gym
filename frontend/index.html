    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": no iPhone, a barra de status fica fora do app e acompanha o tema do celular. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CL Gym" />
    <link rel="icon" href="/icone-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
